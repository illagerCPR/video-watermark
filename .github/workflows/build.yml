name: build

# 双平台自动构建（Windows exe + Linux 单文件）：
# - 推送 v* 标签 → 构建并自动创建 Release（附双平台产物）
# - 手动触发（workflow_dispatch）→ 仅构建 + 自检，用于验证 CI
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # tag 触发时创建 Release 需要

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: VideoWatermark-windows-x86_64
          - os: ubuntu-22.04 # 用 22.04 构建以获得更宽的 glibc 兼容范围
            artifact: VideoWatermark-linux-x86_64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      # Linux runner 无显示环境：补齐 Qt 运行所需的系统图形库（offscreen 自检用）
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Build (PyInstaller)
        run: python -m PyInstaller video_watermark.spec --noconfirm

      - name: Selftest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -Wait -PassThru -FilePath "dist\VideoWatermark.exe" -ArgumentList "--selftest"
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }
          Write-Host "SELFTEST_OK exit=$($p.ExitCode)"

      - name: Selftest (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./dist/VideoWatermark --selftest

      - name: Package (Linux tar.gz)
        if: runner.os == 'Linux'
        run: tar -czf "VideoWatermark-linux-x86_64.tar.gz" -C dist VideoWatermark

      - name: Package (Windows rename)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "dist\VideoWatermark.exe" "VideoWatermark-windows-x86_64.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: VideoWatermark-*-x86_64.*
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist/
          # Release 已存在（如重跑/手动建过）则只补传产物，否则创建新 Release
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "VideoWatermark $GITHUB_REF_NAME" \
              --generate-notes
          fi
